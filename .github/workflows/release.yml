name: ci-release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  # Weekly, Monday 00:00 UTC (09:00 KST). VS Code ships whether or not this
  # repo does: between 2026-09-09 and 2026-10-02 it went from 1.134 to 1.140
  # while CI ran zero times. .vscode-test.mjs pins no version, so each run
  # tests whatever stable is that day.
  #
  # Two GitHub limits: schedules run on the default branch only, and GitHub
  # disables them after 60 days without repository activity. The `release`
  # job is gated on a tag ref, so a scheduled run never publishes anything.
  schedule:
    - cron: "0 0 * * 1"
  # A manual run can pick the runner image, to try a new one before the
  # `ubuntu-latest` label moves to it: `gh workflow run ci-release -f
  # runner=ubuntu-26.04`. Every other trigger leaves `inputs` empty, so it
  # gets `ubuntu-latest`.
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image for the build job"
        required: false
        default: ubuntu-latest

permissions:
  contents: write

# Actions are pinned to full commit SHAs, with the version in a comment. A
# tag can be moved to other code; a SHA cannot. Bump them when CI warns, as
# it did on 2026-10-19 about upload-artifact@v4 still running on Node.js 20.
jobs:
  build:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # TypeScript 7 readiness, advisory only. The build stays on 6.0 because
      # typescript-eslint still requires `<6.1.0`; this step only says early
      # whether the source would type-check under 7. `continue-on-error`
      # keeps a failure here from failing the build, but the step still
      # shows red, and the weekly run surfaces it without anyone pushing.
      - name: Type check under TypeScript 7 (advisory)
        continue-on-error: true
        run: npm run check:ts7

      - name: Lint
        run: npm run lint

      # The suite drives a real VS Code instance, which needs a display.
      # Without xvfb the run dies before the first test.
      - name: Test
        run: xvfb-run -a npm test

      - name: Package VSIX
        run: npx @vscode/vsce package

      - name: Upload VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  # Publishing to the Marketplace is done by hand, by uploading the VSIX at
  # https://marketplace.visualstudio.com/manage/publishers/jungsehui.
  #
  # There used to be a `publish` job here running `vsce publish` with a
  # VSCE_PAT secret. That secret does not exist and will not: creating the
  # Azure DevOps organisation a PAT requires kept demanding a payment card,
  # so this project moved to manual upload. The job failed on every single
  # tag push with "TF400813: the user 'aaaaaaaa-...' is not authorized",
  # which is what Azure DevOps returns for an absent token.
  #
  # So the tag build now does the part a machine can do: attach the exact
  # VSIX to the GitHub Release, so the manual upload is a download away
  # instead of a local `vsce package`.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          vsix=$(ls -1 ./*.vsix | head -1)
          echo "Attaching $vsix to $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$vsix" --clobber
          else
            gh release create "$TAG" "$vsix" \
              --title "$TAG" \
              --notes "Install by uploading this VSIX at https://marketplace.visualstudio.com/manage/publishers/jungsehui — see CHANGELOG.md for what changed."
          fi
