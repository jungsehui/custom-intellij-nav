name: ci-release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      # The suite drives a real VS Code instance, which needs a display.
      # Without xvfb the run dies before the first test.
      - name: Test
        run: xvfb-run -a npm test

      - name: Package VSIX
        run: npx @vscode/vsce package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

  # Publishing to the Marketplace is done by hand, by uploading the VSIX at
  # https://marketplace.visualstudio.com/manage/publishers/jungsehui.
  #
  # There used to be a `publish` job here running `vsce publish` with a
  # VSCE_PAT secret. That secret does not exist and will not: creating the
  # Azure DevOps organisation a PAT requires kept demanding a payment card,
  # so this project moved to manual upload. The job failed on every single
  # tag push with "TF400813: the user 'aaaaaaaa-...' is not authorized",
  # which is what Azure DevOps returns for an absent token.
  #
  # So the tag build now does the part a machine can do: attach the exact
  # VSIX to the GitHub Release, so the manual upload is a download away
  # instead of a local `vsce package`.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          vsix=$(ls -1 ./*.vsix | head -1)
          echo "Attaching $vsix to $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$vsix" --clobber
          else
            gh release create "$TAG" "$vsix" \
              --title "$TAG" \
              --notes "Install by uploading this VSIX at https://marketplace.visualstudio.com/manage/publishers/jungsehui — see CHANGELOG.md for what changed."
          fi
