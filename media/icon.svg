<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="55%" stop-color="#7C6CF5"/>
      <stop offset="100%" stop-color="#B24BF3"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2F3A"/>
      <stop offset="100%" stop-color="#1B1E26"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- code lines, dimmed -->
  <rect x="40" y="66"  width="86"  height="14" rx="7" fill="#3E4657"/>
  <rect x="40" y="180" width="110" height="14" rx="7" fill="#3E4657"/>

  <!-- the active line -->
  <rect x="40" y="121" width="70" height="16" rx="8" fill="url(#accent)"/>

  <!-- jump chevron -->
  <path d="M132 96 L186 129 L132 162"
        fill="none" stroke="url(#accent)" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- target caret -->
  <rect x="200" y="104" width="14" height="50" rx="7" fill="#4FC3F7"/>
</svg>
